name: correctness
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: vectormatch
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: vectormatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VM_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/vectormatch_test
      VM_TEST_PG_USER: vectormatch
      VM_TEST_PG_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon check
      - run: gradle --no-daemon :cluster:failoverSmoke
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/run-replicated.sh deploy/cluster.sh deploy/postgres.sh
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
