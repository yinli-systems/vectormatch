name: correctness-existing-cpu
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique label of a pre-registered one-job CPU runner
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: correctness-existing-cpu
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: [self-hosted, Linux, X64, '${{ inputs.runner_label }}']
    timeout-minutes: 45
    steps:
      - name: Require sparse-checkout-capable Git before any source download
        run: |
          "$VM_CI_PYTHON" - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['git', '--version'], text=True).strip()
          match = re.search(r'git version (\d+)\.(\d+)', version)
          assert match and tuple(map(int, match.groups())) >= (2, 28), version + ': sparse checkout requires Git >=2.28; refusing full-archive fallback'
          print(version)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: source
        timeout-minutes: 5
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            gradle
            core
            cluster
            server
            projector
            bench
            scripts
            deploy
            web
            tools/udp-path
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Verify Linux toolchain and run all correctness gates
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: bash scripts/ci-existing-cpu.sh
      - name: Record JUnit and regression evidence
        if: always() && steps.source.outcome == 'success'
        run: python3 scripts/ci-summary.py
